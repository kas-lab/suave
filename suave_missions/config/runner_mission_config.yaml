/mission_metrics:
  ros__parameters:
    water_visibility_threshold: [3.25, 2.25, 1.25]
    expected_altitude: [3.0, 2.0, 1.0]
    battery_limit: 0.25

/mission_node:
  ros__parameters:
    time_limit: 200 # Time limit for a time_constrained mission
    f_generate_search_path_mode: "fd_spiral_low" # Default mode for f_generate_search_path when no manager is used
    f_follow_pipeline_mode: "fd_follow_pipeline" # Default mode for f_follow_pipeline when no manager is used

/water_visibility_observer_node:
  ros__parameters:
    qa_publishing_period: 1.0
    water_visibility_period: 120 # Water visibility period in seconds
    water_visibility_min: 1.25 # Minimum value for water visibility
    water_visibility_max: 3.75 # Maximum value for water visibility
    water_visibility_sec_shift: 0.0 # Water visibility seconds shift to left

/water_current:
  ros__parameters:
    mean_current: 0.05 # Mean current speed in m/s
    amplitude: 0.03 # Sinusoidal current speed amplitude in m/s
    period: 90.0 # Sinusoidal current oscillation period in seconds
    heading: 0.0 # Mean current heading
    heading_unit: "degrees" # Unit for heading angles: degrees or radians
    heading_amplitude: 10.0 # Sinusoidal heading amplitude in heading_unit
    heading_period: 120.0 # Sinusoidal heading oscillation period in seconds
    heading_noise_std: 0.0 # Gauss-Markov heading noise std in heading_unit (0 disables)
    heading_noise_time_constant: 30.0 # Gauss-Markov noise correlation time in seconds
    heading_noise_seed: 0 # Random seed for the heading noise
    publish_period: 1.0 # Current vector publishing period in seconds

/thruster_monitor:
  ros__parameters:
    thruster_events: # Thruster events, format: (thruster number (1 to 6), failure or recovery, delta time in seconds(from the last event))
    - (1,failure,35)

/task_bridge:
  ros__parameters:
    adapt_period: 30 # Period to perform random adaptation in seconds

