/suave_runner_node:
  ros__parameters:
    result_path: '~/suave/results'
    gui: false # Enable GUI
    experiment_logging: false # Enable silent mode
    mission_config_pkg: 'suave_missions'
    mission_config_file: 'config/runner_mission_config.yaml'
    enable_water_current: true # Enable the water_current node in each run
    water_visibility_sec_shift: 0.0
    water_visibility_sec_shift_random_interval: [0.0, 120.0]
    thruster_events:
      - (1,failure,100)
      - (3,failure,100)
    thruster_events_random_interval: [-100.0, 100.0]
    random_interval: 5
    random_seed: 100
    initial_pos_x: -17.0
    initial_pos_y: 2.5
    initial_pos_x_random_interval: [0.0, 0.0]
    initial_pos_y_random_interval: [-0.5, 0.5]
    experiments:
      - |
        {
          "experiment_launch": "ros2 launch suave_bringup mission.launch.py adaptation_manager:=bt",
          "num_runs": 10,
          "adaptation_manager": "bt",
          "mission_name": "suave_water_current"
        }
      - |
        {
          "experiment_launch": "ros2 launch suave_bringup mission.launch.py adaptation_manager:=none",
          "num_runs": 10,
          "adaptation_manager": "none",
          "mission_name": "suave_water_current"
        }
