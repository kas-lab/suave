# Paths are resolved by the launch file through launch substitutions.
# `results_root` must point at the exp2 campaign folder (the one
# holding runs.json and the raw <manager>_<mission>.csv files);
# only each run's accepted attempt is analyzed.
/wilcoxon_analysis:
  ros__parameters:
    result_path: '$(var output_root)'
    filename: 'exp2_wilcoxon'
    correction: '$(var correction)'
    data_files:
      - |
        {
          "managing_system": "none",
          "data_file": "$(var results_root)/none_suave.csv"
        }
      - |
        {
          "managing_system": "random",
          "data_file": "$(var results_root)/random_suave.csv"
        }
      - |
        {
          "managing_system": "bt",
          "data_file": "$(var results_root)/bt_suave.csv"
        }
      - |
        {
          "managing_system": "metacontrol",
          "data_file": "$(var results_root)/metacontrol_suave.csv"
        }
