# Paths are resolved by the launch file through launch substitutions.
# `results_root` must point at the extended_exp1 campaign folder (the one
# holding runs.json and the raw <manager>_<mission>.csv files);
# only each run's accepted attempt is analyzed.
#
# extended_exp1_runner_config.yml currently only runs the `bt` managing
# system, so there is nothing to pair it against yet. Add more
# `managing_system` entries here once that campaign's runner config grows
# to include other systems.
/wilcoxon_analysis:
  ros__parameters:
    result_path: '$(var output_root)'
    filename: 'extended_exp1_wilcoxon'
    correction: '$(var correction)'
    data_files:
      - |
        {
          "managing_system": "bt",
          "data_file": "$(var results_root)/bt_suave_extended.csv"
        }
